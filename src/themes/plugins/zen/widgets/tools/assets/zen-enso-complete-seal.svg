    <path d="M 198 78 C 128 55 61 102 52 174 C 43 249 105 303 179 298 C 251 293 296 235 285 163 C 276 101 226 69 198 78" stroke="url(#gold-stroke)" stroke-width="19" opacity=".94" filter="url(#brush)"/>
    <path d="M 198 88 C 134 64 70 108 62 176 C 54 240 111 288 180 286 C 244 284 284 232 275 164 C 267 110 225 80 198 88" stroke="#fff7d6" stroke-width="4" stroke-dasharray="18 28 5 22 34 48" opacity=".72" filter="url(#brush)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" role="img" aria-label="Completed golden Enso seal">
  <defs>
    <radialGradient id="gold-orb" cx="48%" cy="42%" r="66%">
      <stop offset="0%" stop-color="#fff7d6" stop-opacity="1"/>
      <stop offset="48%" stop-color="#facc15" stop-opacity=".86"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-stroke" x1="16%" y1="16%" x2="88%" y2="82%">
      <stop offset="0%" stop-color="#fff7d6" stop-opacity=".96"/>
      <stop offset="28%" stop-color="#facc15" stop-opacity=".98"/>
      <stop offset="62%" stop-color="#d4af37" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#8a5d16" stop-opacity=".82"/>
    </linearGradient>
    <filter id="brush" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".12" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5.2" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
